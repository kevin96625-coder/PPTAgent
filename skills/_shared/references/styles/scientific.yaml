name: Scientific
mood: Academic, precise, scholarly. Clean blue with structured data emphasis.

color_scheme:
  primary: "#1565c0"      # Academic blue
  secondary: "#42a5f5"    # Light blue
  accent: "#ff7043"       # Warm orange
  background: "#fafafa"   # Near-white
  text: "#212121"         # Dark gray
  card_bg: "#ffffff"      # White
  chart_colors:
    - "#ff7043"            # Warm orange (accent)
    - "#1565c0"            # Blue
    - "#2e7d32"            # Green
    - "#7b1fa2"            # Purple
    - "#c62828"            # Red
    - "#00838f"            # Teal
    - "#ef6c00"            # Deep orange
    - "#4527a0"            # Deep purple

typography:
  heading_font: "Merriweather, Georgia, 'PingFang SC', 'Microsoft YaHei', serif"
  body_font: "Source Sans 3, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif"
  cjk_font: "'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif"
  mono_font: "JetBrains Mono, Menlo, monospace"
  scale: 0.95

card_style:
  border_radius: 4
  shadow: "0 1px 3px rgba(0,0,0,0.06)"
  border: "1px solid #e0e0e0"
  gap: 24

gradients:
  hero_bg: "linear-gradient(180deg, #1565c0 0%, #1976d2 100%)"
  card_highlight: "linear-gradient(180deg, #ffffff 0%, #fafafa 100%)"

elevation:
  shadow_sm: "0 1px 2px rgba(0,0,0,0.04)"
  shadow_md: "0 2px 6px rgba(0,0,0,0.08)"
  shadow_lg: "0 6px 20px rgba(0,0,0,0.12)"

decoration:
  pattern: "none"
  pattern_opacity: 0
  icon_style: "outline"
  icon_weight: 1.5

slide_type_overrides:
  cover:
    card_bg: "#1565c0"
    text: "#ffffff"
    heading_scale: 1.2
  quote:
    card_bg: "#e3f2fd"
    text: "#1565c0"
    body_font_style: "italic"
  data:
    heading_scale: 0.9
  section_divider:
    background: "#1565c0"
    text: "#ffffff"

typography_ladder:           # base px @ scale 1.0; 实际 = base * typography.scale * (type override)
  h1: 64        # 封面/区隔大标题、hero 数字(原 48-72 区间收敛到 64 档)
  h2: 40        # 页面主标题(原 36-44 → 40 档)
  h3: 28        # 卡片标题/小节标题(原 24-32 → 28 档)
  body: 18      # 正文(社区反馈下限 16;取 18)
  label: 15     # 标签/坐标轴/图例(≥14 floor;取 15)
  caption: 14   # 脚注/出处(≥14)
  micro: 12     # 页码/角标(唯一允许 <14 的角色,data-role=page-number/label)

color_ratio:                 # 60/30/10 设计意图预算(面积占比),非硬约束;仅供软警告参考
  dominant: 60               # 主导(通常 background)
  secondary: 30              # 次级(primary/secondary/card_bg/text)
  accent: 10                 # 强调(accent)
  buckets:                   # 把 color_scheme 的 token 归到三桶(校验器据此分类 fill)
    dominant: [background]
    secondary: [primary, secondary, card_bg, text]
    accent: [accent]
