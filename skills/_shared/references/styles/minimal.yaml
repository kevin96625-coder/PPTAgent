name: Minimal Clean
mood: Serene, focused, elegant. Maximum whitespace, minimum visual noise.

color_scheme:
  primary: "#18181b"      # Near-black
  secondary: "#71717a"    # Zinc gray
  accent: "#3b82f6"       # Blue (used sparingly)
  background: "#fafafa"   # Off-white
  text: "#27272a"         # Dark zinc
  card_bg: "#ffffff"      # Pure white
  chart_colors:            # Multi-series data viz; [0]=accent
    - "#3b82f6"            # Blue (accent)
    - "#71717a"            # Zinc gray
    - "#f59e0b"            # Amber
    - "#10b981"            # Emerald
    - "#ef4444"            # Red
    - "#8b5cf6"            # Violet
    - "#06b6d4"            # Cyan
    - "#d946ef"            # Fuchsia

typography:
  heading_font: "Instrument Serif, Georgia, 'PingFang SC', 'Microsoft YaHei', serif"
  body_font: "Work Sans, Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif"
  cjk_font: "'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif"
  mono_font: "JetBrains Mono, Geist Mono, Menlo, monospace"
  scale: 0.95

card_style:
  border_radius: 8
  shadow: "0 1px 3px rgba(0,0,0,0.05)"
  gap: 28

gradients:
  hero_bg: "linear-gradient(180deg, #fafafa 0%, #f5f5f5 100%)"
  card_highlight: "linear-gradient(180deg, #ffffff 0%, #fafafa 100%)"

elevation:
  shadow_sm: "0 1px 2px rgba(0,0,0,0.03)"
  shadow_md: "0 2px 8px rgba(0,0,0,0.06)"
  shadow_lg: "0 8px 24px rgba(0,0,0,0.1)"

decoration:
  pattern: "none"
  pattern_opacity: 0
  icon_style: "outline"
  icon_weight: 1

slide_type_overrides:
  cover:
    card_bg: "#18181b"
    text: "#fafafa"
    heading_scale: 1.2
  quote:
    card_bg: "#fafafa"
    text: "#18181b"
    body_font_style: "italic"
  data:
    heading_scale: 0.9
  section_divider:
    background: "#18181b"
    text: "#fafafa"

typography_ladder:           # base px @ scale 1.0; 实际 = base * typography.scale * (type override)
  h1: 64        # 封面/区隔大标题、hero 数字(原 48-72 区间收敛到 64 档)
  h2: 40        # 页面主标题(原 36-44 → 40 档)
  h3: 28        # 卡片标题/小节标题(原 24-32 → 28 档)
  body: 18      # 正文(社区反馈下限 16;取 18)
  label: 15     # 标签/坐标轴/图例(≥14 floor;取 15)
  caption: 14   # 脚注/出处(≥14)
  micro: 12     # 页码/角标(唯一允许 <14 的角色,data-role=page-number/label)

color_ratio:                 # 60/30/10 设计意图预算(面积占比),非硬约束;仅供软警告参考
  dominant: 60               # 主导(通常 background)
  secondary: 30              # 次级(primary/secondary/card_bg/text)
  accent: 10                 # 强调(accent)
  buckets:                   # 把 color_scheme 的 token 归到三桶(校验器据此分类 fill)
    dominant: [background]
    secondary: [primary, secondary, card_bg, text]
    accent: [accent]
