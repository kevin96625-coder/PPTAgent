name: Pixel Art
mood: Retro, playful, 8-bit nostalgic. Sharp edges, bright primary colors.

color_scheme:
  primary: "#222034"      # Dark pixel blue
  secondary: "#45283c"    # Dark pixel brown
  accent: "#99e550"       # Pixel green
  background: "#222034"   # Dark background
  text: "#ffffff"         # White
  card_bg: "#323c39"      # Dark green-gray
  chart_colors:
    - "#99e550"            # Pixel green (accent)
    - "#6abe30"            # Dark green
    - "#37946e"            # Teal
    - "#5fcde4"            # Cyan
    - "#cbdbfc"            # Light blue
    - "#d77bba"            # Pink
    - "#d95763"            # Red
    - "#fbf236"            # Yellow

typography:
  heading_font: "'Press Start 2P', 'Courier New', 'PingFang SC', 'Microsoft YaHei', monospace"
  body_font: "VT323, 'Courier New', 'PingFang SC', 'Microsoft YaHei', monospace"
  cjk_font: "'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif"
  scale: 0.9

card_style:
  border_radius: 0
  shadow: "4px 4px 0 rgba(0,0,0,0.5)"
  border: "3px solid #ffffff"
  gap: 16

gradients:
  hero_bg: "linear-gradient(180deg, #222034 0%, #323c39 100%)"
  card_highlight: "linear-gradient(180deg, #323c39 0%, #222034 100%)"

elevation:
  shadow_sm: "2px 2px 0 rgba(0,0,0,0.3)"
  shadow_md: "4px 4px 0 rgba(0,0,0,0.5)"
  shadow_lg: "6px 6px 0 rgba(0,0,0,0.5)"

decoration:
  pattern: "grid"
  pattern_opacity: 0.06
  icon_style: "filled"
  icon_weight: 2

slide_type_overrides:
  cover:
    card_bg: "#222034"
    text: "#99e550"
    heading_scale: 1.2
  quote:
    card_bg: "#323c39"
    text: "#99e550"
    body_font_style: "normal"
  data:
    heading_scale: 0.85
  section_divider:
    background: "#222034"
    text: "#99e550"

typography_ladder:           # base px @ scale 1.0; 实际 = base * typography.scale * (type override)
  h1: 64        # 封面/区隔大标题、hero 数字(原 48-72 区间收敛到 64 档)
  h2: 40        # 页面主标题(原 36-44 → 40 档)
  h3: 28        # 卡片标题/小节标题(原 24-32 → 28 档)
  body: 18      # 正文(社区反馈下限 16;取 18)
  label: 15     # 标签/坐标轴/图例(≥14 floor;取 15)
  caption: 14   # 脚注/出处(≥14)
  micro: 12     # 页码/角标(唯一允许 <14 的角色,data-role=page-number/label)

color_ratio:                 # 60/30/10 设计意图预算(面积占比),非硬约束;仅供软警告参考
  dominant: 60               # 主导(通常 background)
  secondary: 30              # 次级(primary/secondary/card_bg/text)
  accent: 10                 # 强调(accent)
  buckets:                   # 把 color_scheme 的 token 归到三桶(校验器据此分类 fill)
    dominant: [background]
    secondary: [primary, secondary, card_bg, text]
    accent: [accent]
