name: Bold Editorial
mood: High-impact, magazine-style, dramatic. Maximum contrast with bold typography.

color_scheme:
  primary: "#000000"      # Pure black
  secondary: "#333333"    # Dark gray
  accent: "#ff2d55"       # Vivid red
  background: "#ffffff"   # White
  text: "#111111"         # Near-black
  card_bg: "#f5f5f5"      # Light gray
  chart_colors:
    - "#ff2d55"            # Vivid red (accent)
    - "#007aff"            # Blue
    - "#ff9500"            # Orange
    - "#34c759"            # Green
    - "#af52de"            # Purple
    - "#5856d6"            # Indigo
    - "#ff3b30"            # Red-orange
    - "#00c7be"            # Mint

typography:
  heading_font: "Playfair Display, Georgia, 'PingFang SC', 'Microsoft YaHei', serif"
  body_font: "Source Sans 3, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif"
  cjk_font: "'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif"
  scale: 1.1

card_style:
  border_radius: 0
  shadow: "none"
  border: "3px solid #000000"
  gap: 20

gradients:
  hero_bg: "linear-gradient(180deg, #000000 0%, #1a1a1a 100%)"
  card_highlight: "linear-gradient(180deg, #f5f5f5 0%, #ffffff 100%)"

elevation:
  shadow_sm: "none"
  shadow_md: "4px 4px 0 #000000"
  shadow_lg: "8px 8px 0 #000000"

decoration:
  pattern: "none"
  pattern_opacity: 0
  icon_style: "filled"
  icon_weight: 2

slide_type_overrides:
  cover:
    card_bg: "#000000"
    text: "#ffffff"
    heading_scale: 1.5
  quote:
    card_bg: "#ff2d55"
    text: "#ffffff"
    body_font_style: "italic"
  data:
    heading_scale: 0.9
  section_divider:
    background: "#000000"
    text: "#ff2d55"

typography_ladder:           # base px @ scale 1.0; 实际 = base * typography.scale * (type override)
  h1: 64        # 封面/区隔大标题、hero 数字(原 48-72 区间收敛到 64 档)
  h2: 40        # 页面主标题(原 36-44 → 40 档)
  h3: 28        # 卡片标题/小节标题(原 24-32 → 28 档)
  body: 18      # 正文(社区反馈下限 16;取 18)
  label: 15     # 标签/坐标轴/图例(≥14 floor;取 15)
  caption: 14   # 脚注/出处(≥14)
  micro: 12     # 页码/角标(唯一允许 <14 的角色,data-role=page-number/label)

color_ratio:                 # 60/30/10 设计意图预算(面积占比),非硬约束;仅供软警告参考
  dominant: 60               # 主导(通常 background)
  secondary: 30              # 次级(primary/secondary/card_bg/text)
  accent: 10                 # 强调(accent)
  buckets:                   # 把 color_scheme 的 token 归到三桶(校验器据此分类 fill)
    dominant: [background]
    secondary: [primary, secondary, card_bg, text]
    accent: [accent]
