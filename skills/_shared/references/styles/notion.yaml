name: Notion
mood: Structured, clear, systematic. Notion-like clarity with clean hierarchy.

color_scheme:
  primary: "#37352f"      # Notion dark
  secondary: "#787774"    # Notion gray
  accent: "#2eaadc"       # Notion blue
  background: "#ffffff"   # White
  text: "#37352f"         # Notion dark
  card_bg: "#f7f6f3"      # Notion light bg
  chart_colors:
    - "#2eaadc"            # Blue (accent)
    - "#6940a5"            # Purple
    - "#d44c47"            # Red
    - "#cb912f"            # Yellow
    - "#448361"            # Green
    - "#d9730d"            # Orange
    - "#9065b0"            # Lavender
    - "#337ea9"            # Dark blue

typography:
  heading_font: "Inter, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"
  body_font: "Inter, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"
  cjk_font: "'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif"
  scale: 0.95

card_style:
  border_radius: 6
  shadow: "none"
  border: "1px solid #e9e9e7"
  gap: 24

gradients:
  hero_bg: "linear-gradient(180deg, #37352f 0%, #4a4a46 100%)"
  card_highlight: "linear-gradient(180deg, #f7f6f3 0%, #ffffff 100%)"

elevation:
  shadow_sm: "0 1px 1px rgba(0,0,0,0.03)"
  shadow_md: "0 2px 4px rgba(0,0,0,0.06)"
  shadow_lg: "0 4px 12px rgba(0,0,0,0.08)"

decoration:
  pattern: "none"
  pattern_opacity: 0
  icon_style: "outline"
  icon_weight: 1.5

slide_type_overrides:
  cover:
    card_bg: "#37352f"
    text: "#ffffff"
    heading_scale: 1.2
  quote:
    card_bg: "#f7f6f3"
    text: "#37352f"
    body_font_style: "italic"
  data:
    heading_scale: 0.9
  section_divider:
    background: "#37352f"
    text: "#ffffff"

typography_ladder:           # base px @ scale 1.0; 实际 = base * typography.scale * (type override)
  h1: 64        # 封面/区隔大标题、hero 数字(原 48-72 区间收敛到 64 档)
  h2: 40        # 页面主标题(原 36-44 → 40 档)
  h3: 28        # 卡片标题/小节标题(原 24-32 → 28 档)
  body: 18      # 正文(社区反馈下限 16;取 18)
  label: 15     # 标签/坐标轴/图例(≥14 floor;取 15)
  caption: 14   # 脚注/出处(≥14)
  micro: 12     # 页码/角标(唯一允许 <14 的角色,data-role=page-number/label)

color_ratio:                 # 60/30/10 设计意图预算(面积占比),非硬约束;仅供软警告参考
  dominant: 60               # 主导(通常 background)
  secondary: 30              # 次级(primary/secondary/card_bg/text)
  accent: 10                 # 强调(accent)
  buckets:                   # 把 color_scheme 的 token 归到三桶(校验器据此分类 fill)
    dominant: [background]
    secondary: [primary, secondary, card_bg, text]
    accent: [accent]
