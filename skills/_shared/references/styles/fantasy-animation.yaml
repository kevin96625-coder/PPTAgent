name: Fantasy Animation
mood: Magical, whimsical, enchanting. Rich purples and gold with ethereal glow.

color_scheme:
  primary: "#4a1a6b"      # Deep purple
  secondary: "#6b3fa0"    # Medium purple
  accent: "#ffd700"       # Gold
  background: "#1a0a2e"   # Dark midnight
  text: "#f0e6ff"         # Lavender white
  card_bg: "#2d1450"      # Dark purple card
  chart_colors:
    - "#ffd700"            # Gold (accent)
    - "#ff6b9d"            # Pink
    - "#4ecdc4"            # Teal
    - "#a78bfa"            # Violet
    - "#ff8a65"            # Coral
    - "#69f0ae"            # Mint green
    - "#ffab40"            # Amber
    - "#7c4dff"            # Deep violet

typography:
  heading_font: "Cinzel, Georgia, 'PingFang SC', 'Microsoft YaHei', serif"
  body_font: "Quicksand, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif"
  cjk_font: "'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif"
  scale: 1.0

card_style:
  border_radius: 20
  shadow: "0 4px 20px rgba(255,215,0,0.1)"
  border: "1px solid rgba(255,215,0,0.2)"
  gap: 24

gradients:
  hero_bg: "linear-gradient(135deg, #1a0a2e 0%, #4a1a6b 50%, #1a0a2e 100%)"
  card_highlight: "linear-gradient(180deg, #2d1450 0%, #1a0a2e 100%)"

elevation:
  shadow_sm: "0 2px 4px rgba(255,215,0,0.05)"
  shadow_md: "0 4px 20px rgba(255,215,0,0.1)"
  shadow_lg: "0 8px 40px rgba(255,215,0,0.15)"

decoration:
  pattern: "dots"
  pattern_opacity: 0.04
  icon_style: "duotone"
  icon_weight: 1.5

slide_type_overrides:
  cover:
    card_bg: "#4a1a6b"
    text: "#ffd700"
    heading_scale: 1.4
  quote:
    card_bg: "#2d1450"
    text: "#ffd700"
    body_font_style: "italic"
  data:
    heading_scale: 0.9
  section_divider:
    background: "#4a1a6b"
    text: "#ffd700"

typography_ladder:           # base px @ scale 1.0; 实际 = base * typography.scale * (type override)
  h1: 64        # 封面/区隔大标题、hero 数字(原 48-72 区间收敛到 64 档)
  h2: 40        # 页面主标题(原 36-44 → 40 档)
  h3: 28        # 卡片标题/小节标题(原 24-32 → 28 档)
  body: 18      # 正文(社区反馈下限 16;取 18)
  label: 15     # 标签/坐标轴/图例(≥14 floor;取 15)
  caption: 14   # 脚注/出处(≥14)
  micro: 12     # 页码/角标(唯一允许 <14 的角色,data-role=page-number/label)

color_ratio:                 # 60/30/10 设计意图预算(面积占比),非硬约束;仅供软警告参考
  dominant: 60               # 主导(通常 background)
  secondary: 30              # 次级(primary/secondary/card_bg/text)
  accent: 10                 # 强调(accent)
  buckets:                   # 把 color_scheme 的 token 归到三桶(校验器据此分类 fill)
    dominant: [background]
    secondary: [primary, secondary, card_bg, text]
    accent: [accent]
